name: Ubuntu + Ollama + LocalTunnel

on:
  workflow_dispatch:

jobs:
  ubuntu-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      # ==========================================
      # 1. SYSTEM INFORMATION
      # ==========================================
      - name: System Information
        run: |
          echo "=========================================="
          echo "            UBUNTU SERVER"
          echo "=========================================="

          echo ""
          echo "=== OS ==="
          cat /etc/os-release

          echo ""
          echo "=== CPU ==="
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)' || true

          echo ""
          echo "=== RAM ==="
          free -h

          echo ""
          echo "=== DISK ==="
          df -h /

          echo ""
          echo "=== GPU ==="
          lspci | grep -i -E "vga|3d|nvidia" || true

      # ==========================================
      # 2. INSTALL PACKAGES
      # ==========================================
      - name: Install Required Packages
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl \
            wget \
            git \
            nano \
            vim \
            htop \
            net-tools \
            iproute2 \
            lsof \
            ca-certificates \
            unzip \
            nodejs \
            npm

      # ==========================================
      # 3. INSTALL OLLAMA
      # ==========================================
      - name: Install Ollama
        run: |
          echo "=========================================="
          echo "          INSTALLING OLLAMA"
          echo "=========================================="

          curl -fsSL https://ollama.com/install.sh | sh

          ollama --version

      # ==========================================
      # 4. START OLLAMA
      # ==========================================
      - name: Start Ollama
        run: |
          echo "Starting Ollama..."

          nohup ollama serve > /tmp/ollama.log 2>&1 &

          sleep 10

          echo ""
          echo "=== Ollama API ==="

          curl -s http://127.0.0.1:11434/api/tags || true

      # ==========================================
      # 5. DOWNLOAD QWEN
      # ==========================================
      - name: Install Qwen 2.5 Coder 7B
        run: |
          echo "=========================================="
          echo "       DOWNLOADING QWEN 2.5 CODER 7B"
          echo "=========================================="

          ollama pull qwen2.5-coder:7b

          echo ""
          echo "=== MODELS ==="

          ollama list

      # ==========================================
      # 6. TEST OLLAMA
      # ==========================================
      - name: Test Ollama
        run: |
          echo "=========================================="
          echo "              OLLAMA TEST"
          echo "=========================================="

          curl -s http://127.0.0.1:11434/api/tags

          echo ""
          echo ""

          ollama run qwen2.5-coder:7b \
            "Write a simple Python Hello World program."

      # ==========================================
      # 7. INSTALL LOCALTUNNEL
      # ==========================================
      - name: Install LocalTunnel
        run: |
          echo "=========================================="
          echo "          INSTALLING LOCALTUNNEL"
          echo "=========================================="

          sudo npm install -g localtunnel

          echo ""
          echo "=== LocalTunnel Version ==="

          lt --version

      # ==========================================
      # 8. START LOCALTUNNEL TUNNEL
      # ==========================================
      - name: Start LocalTunnel
        run: |
          echo "=========================================="
          echo "          STARTING LOCALTUNNEL"
          echo "=========================================="

          echo ""
          echo "Ollama is listening on:"
          echo "http://127.0.0.1:11434"

          echo ""
          echo "Starting LocalTunnel..."
          echo ""

          nohup npx localtunnel --port 11434 > /tmp/localtunnel.log 2>&1 &

          LOCALTUNNEL_PID=$!

          echo "LocalTunnel PID: $LOCALTUNNEL_PID"

          echo ""
          echo "Waiting for LocalTunnel URL..."

          TUNNEL_URL=""

          for i in {1..60}; do
            sleep 2

            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' /tmp/localtunnel.log | head -1 || true)

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            echo "Waiting... $i/60"

            if ! kill -0 "$LOCALTUNNEL_PID" 2>/dev/null; then
              echo ""
              echo "ERROR: localtunnel process stopped."

              echo ""
              echo "=== LocalTunnel Log ==="
              cat /tmp/localtunnel.log

              exit 1
            fi
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo ""
            echo "ERROR: LocalTunnel URL was not found."

            echo ""
            echo "=== LocalTunnel Log ==="
            cat /tmp/localtunnel.log

            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "         LOCALTUNNEL READY"
          echo "=========================================="

          echo ""
          echo "Ollama URL:"
          echo "$TUNNEL_URL"

          echo ""
          echo "Ollama API:"
          echo "$TUNNEL_URL/api/tags"

          echo ""
          echo "=========================================="

      # ==========================================
      # 9. TEST LOCALTUNNEL → OLLAMA
      # ==========================================
      - name: Test LocalTunnel
        run: |
          echo "=========================================="
          echo "       TESTING LOCALTUNNEL → OLLAMA"
          echo "=========================================="

          sleep 5

          echo ""
          echo "Testing:"
          echo "$TUNNEL_URL/api/tags"

          echo ""

          curl -sSL \
            -H "bypass-tunnel-reminder: true" \
            --max-time 30 \
            "$TUNNEL_URL/api/tags"

          echo ""
          echo ""
          echo "=========================================="
          echo " LocalTunnel → Ollama connection WORKS"
          echo "=========================================="

      # ==========================================
      # 10. FINAL INFORMATION
      # ==========================================
      - name: Server Ready
        run: |
          echo ""
          echo "=========================================="
          echo "         UBUNTU SERVER READY"
          echo "=========================================="

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "RAM:"
          free -h

          echo ""
          echo "DISK:"
          df -h /

          echo ""
          echo "OLLAMA:"
          ollama --version

          echo ""
          echo "MODELS:"
          ollama list

          echo ""
          echo "=========================================="
          echo "         LOCALTUNNEL OLLAMA URL"
          echo "=========================================="

          echo ""
          echo "$TUNNEL_URL"

          echo ""
          echo "API:"
          echo "$TUNNEL_URL/api/tags"

          echo ""
          echo "=========================================="

      # ==========================================
      # 11. KEEP RUNNER ALIVE
      # ==========================================
      - name: Keep Server Alive
        run: |
          echo ""
          echo "=========================================="
          echo "       UBUNTU SERVER IS RUNNING"
          echo "=========================================="

          echo ""
          echo "Ollama:"
          echo "http://127.0.0.1:11434"

          echo ""
          echo "LocalTunnel:"
          echo "$TUNNEL_URL"

          echo ""
          echo "API:"
          echo "$TUNNEL_URL/api/tags"

          echo ""

          while true; do
            echo "=========================================="
            echo "[$(date)] Server Alive"
            echo "=========================================="

            echo ""
            echo "RAM:"
            free -h

            echo ""
            echo "Ollama Models:"
            ollama list

            echo ""
            echo "LocalTunnel Process:"
            ps aux | grep localtunnel | grep -v grep || true

            echo ""
            sleep 300
          done
